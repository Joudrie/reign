<title>Crown & Succession</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.24/dist/motion.js"></script>
<style>
/* Palette: Vellum. Paper cards lying on a table that is only a shade darker than the cards.
   Layout: a deck of cards on a horizontal rail, each card scrolls on its own; a three-tab bar at the bottom
   (Timeline · Read · Search) switches between the deck and two full-screen views.
   Type: one text face (Source Serif 4) for everything; IM Fell English only for the ruler's name and epithet.
   System: 8px spacing scale, radii 12 (cards, panels) and 8 (controls, images), one card shadow. */
:root {
  --table: #f1ece2;
  --card: #fbf9f4;
  --tile: #f3eee4;
  --edge: #ddd3c2;
  --rule: #e8e0d2;
  --ink: #231f1a;
  --muted: #6f665a;
  --accent: #8a2432;
  --confirmed: #2f7a46;
  --disputed: #b25a12;
  --legend: #6a4fb0;

  --text: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --name: "IM Fell English", "Iowan Old Style", Georgia, serif;

  --t-xs: 0.75rem;    /* 12 */
  --t-sm: 0.875rem;   /* 14 */
  --t-md: 1.0625rem;  /* 17 */
  --t-lg: 1.25rem;    /* 20 */
  --t-xl: 2.25rem;    /* 36 */

  --s-1: 4px; --s0: 8px; --s1: 16px; --s2: 24px; --s3: 32px; --s4: 48px;
  --r: 12px; --r-sm: 8px;
  --card-shadow: 0 1px 2px rgb(60 45 20 / 0.06), 0 8px 24px rgb(60 45 20 / 0.08);
  --tabs-h: 60px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
/* iOS Safari enlarges text it judges too small after re-renders; keep our type scale exactly as set. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--table);
  color: var(--ink);
  font-family: var(--text);
  font-size: var(--t-md);
  line-height: 1.6;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.caps { font-size: var(--t-xs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------- top line ---------- */
.top {
  flex: none;
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s1);
  padding: var(--s1) var(--s2) var(--s0);
  color: var(--muted);
}
.top strong { color: var(--ink); font-weight: 600; font-size: var(--t-sm); }
.top span { font-size: var(--t-xs); font-variant-numeric: tabular-nums; }

.country-btn {
  display: inline-flex; align-items: center; gap: var(--s-1);
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ink); font-weight: 600; font-size: var(--t-sm);
}
.country-btn svg { width: 16px; height: 16px; color: var(--muted); }

/* flags: simple drawn shapes, never emoji */
.flag { display: block; width: 100%; height: 100%; }
.tab-flag { display: block; width: 30px; height: 20px; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px var(--edge); }
.tabs button[aria-current="page"] .tab-flag { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }

/* ---------- deck ---------- */
.deck { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: pan-y; }
.rail {
  position: absolute; top: 0; left: 0;
  bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px));
  display: flex; gap: var(--s0); padding-block: var(--s0) var(--s1);
  will-change: transform;
}
.card {
  flex: none; height: 100%;
  overflow-y: auto; overscroll-behavior-y: contain;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  box-shadow: var(--card-shadow);
  scrollbar-width: thin; scrollbar-color: var(--edge) transparent;
}
.card:focus { outline: none; }
.card:focus-visible { outline: none; }
.deck.dragging { cursor: grabbing; user-select: none; }
.card-inner { padding: var(--s1) var(--s2) var(--s3); display: grid; gap: var(--s2); }
@media (max-width: 420px) { .card-inner { padding: var(--s1) var(--s1) var(--s3); } }

.prev { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prev b { color: var(--accent); font-weight: 600; margin-right: var(--s-1); }

.portrait {
  margin: 0; height: clamp(220px, 40vh, 360px);
  background: var(--tile); border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.portrait:has(.banner) { height: clamp(180px, 28vh, 240px); }
.portrait .banner { height: 84%; width: auto; display: block; }
.portrait img { max-height: 100%; max-width: 100%; object-fit: contain; display: block; -webkit-user-drag: none; user-select: none; }

.title { display: grid; gap: var(--s0); text-align: center; justify-items: center; }
.house { color: var(--muted); text-wrap: balance; }
.house .swatch { margin-right: var(--s0); vertical-align: 1px; }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
h1 { margin: 0; font-family: var(--name); font-weight: 400; font-size: var(--t-xl); line-height: 1.05; text-wrap: balance; }
.epithet { margin-top: calc(var(--s-1) * -1); font-family: var(--name); font-size: var(--t-lg); color: var(--accent); line-height: 1.2; }
.tagline { margin: 0; font-size: var(--t-sm); color: var(--muted); line-height: 1.45; max-width: 36ch; text-wrap: balance; }

.facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); border-radius: var(--r-sm); overflow: hidden; }
.facts div { padding: var(--s0) var(--s1); min-width: 0; }
.facts div:nth-child(odd) { border-right: 1px solid var(--rule); }
.facts div:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
.facts dt { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-size: var(--t-sm); line-height: 1.35; font-variant-numeric: tabular-nums; }

.story { display: grid; gap: var(--s1); }
.story p { margin: 0; }

.section-label { margin: 0; color: var(--accent); }
.claims { display: grid; gap: var(--s1); }
.claims ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s1); }
.claims li { display: grid; gap: 2px; }
.status { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.status.confirmed { color: var(--confirmed); }
.status.disputed { color: var(--disputed); }
.status.legend { color: var(--legend); }
.claim-text { font-size: var(--t-sm); font-weight: 600; line-height: 1.4; }
.claim-note { font-size: var(--t-sm); color: var(--muted); line-height: 1.45; }

.hook { background: var(--tile); border-radius: var(--r); padding: var(--s2); display: grid; gap: var(--s1); }
.hook p { margin: 0; }
.btn {
  justify-self: start;
  font-size: var(--t-sm); font-weight: 600;
  background: var(--ink); color: var(--card);
  border: 0; border-radius: var(--r-sm); padding: var(--s0) var(--s1); min-height: 40px; cursor: pointer;
}
.btn:hover { background: var(--accent); }

details { font-size: var(--t-sm); color: var(--muted); }
summary { cursor: pointer; }
details ul { margin: var(--s0) 0 0; padding-left: var(--s1); display: grid; gap: var(--s-1); }
details a { color: inherit; }
.draft { font-size: var(--t-xs); color: var(--disputed); }

/* desktop side arrows */
.side {
  position: absolute; top: 45%; z-index: 2; display: none;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--edge); box-shadow: var(--card-shadow); cursor: pointer;
}
.side svg { width: 18px; height: 18px; display: block; margin: auto; }
.side:disabled { opacity: 0.35; cursor: default; }
.side.prev-side { left: var(--s2); }
.side.next-side { right: var(--s2); }
@media (min-width: 820px) { .side { display: block; } }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  height: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--card);
  border-top: 1px solid var(--edge);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.tabs button {
  background: none; border: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs svg { width: 26px; height: 26px; }
.tabs .read svg { width: 30px; height: 30px; }
.tabs .tab-flag svg { width: 100%; height: 100%; }
.tabs button[aria-current="page"] .fill { fill: currentColor; }
.tabs button[aria-current="page"] .crown { stroke: var(--card); fill: var(--card); }

/* ---------- full-screen views ---------- */
.view {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px));
  background: var(--table);
  display: flex; flex-direction: column;
  visibility: hidden; opacity: 0;
}
.view-head {
  flex: none; display: flex; align-items: center; gap: var(--s0);
  padding: calc(var(--s1) + env(safe-area-inset-top, 0px)) var(--s2) var(--s1);
}
.view-head h2 { margin: 0 auto 0 0; font-size: var(--t-lg); font-weight: 600; line-height: 1.2; }
.icon-btn { min-width: 40px; height: 40px; padding: 0 var(--s0); background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-sm); cursor: pointer; font-size: var(--t-md); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.view-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--s2) var(--s4); }
@media (max-width: 420px) { .view-head { padding-inline: var(--s1); } .view-body { padding-inline: var(--s1); } }

/* timeline */
.axis { position: relative; margin-left: 48px; max-width: 560px; }
.tick { position: absolute; left: -48px; width: 42px; white-space: nowrap; text-align: right; font-size: var(--t-xs); color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule); }
.bar { position: absolute; width: 12px; border-radius: 3px; cursor: pointer; border: 0; padding: 0; }
.bar.half { width: 5px; }
.leader { position: absolute; height: 0; border-top: 1px solid var(--edge); }
.leader-v { position: absolute; width: 0; border-left: 1px solid var(--edge); }
.label {
  position: absolute; left: var(--label-x, 40px); right: 0;
  background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
  display: grid; line-height: 1.25;
}
.label strong { font-size: var(--t-md); font-weight: 600; }
.label span { font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.label[aria-current="true"] strong { color: var(--accent); }
.label:hover strong { text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; }
.zoom-level { font-size: var(--t-xs); color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

/* countries + search */
.search-body { padding-top: calc(var(--s2) + env(safe-area-inset-top, 0px)); display: grid; align-content: start; gap: var(--s1); }
.search-body .section-label { margin-top: var(--s0); }
.countries { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s0); }
.countries button {
  width: 100%; display: grid; grid-template-columns: 36px 1fr; gap: var(--s0) var(--s1); align-items: center;
  background: var(--card); border: 1px solid var(--edge); border-radius: var(--r); padding: var(--s1);
  text-align: left; cursor: pointer;
}
.countries button:hover:not(:disabled) { border-color: var(--muted); }
.countries button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.countries button:disabled { cursor: default; opacity: 0.55; }
.countries .mini-flag { width: 36px; height: 24px; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px var(--edge); }
.countries .meta { display: grid; line-height: 1.3; min-width: 0; }
.countries strong { font-size: var(--t-sm); font-weight: 600; }
.countries .group { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin: var(--s1) 0 var(--s-1); }
.countries span.sub { font-size: var(--t-xs); color: var(--muted); }
.search-box { position: relative; flex: 1; }
.search-box svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); }
.search-box input {
  width: 100%; height: 44px; padding: 0 var(--s1) 0 40px;
  background: var(--card); border: 1px solid var(--edge); border-radius: var(--r-sm);
  font-size: 1rem;
}
.search-box input::placeholder { color: var(--muted); }
.search-box input:focus-visible { outline: none; border-color: var(--accent); }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s0); }
.results button {
  width: 100%; display: grid; grid-template-columns: 48px 1fr; gap: var(--s1); align-items: center;
  background: var(--card); border: 1px solid var(--edge); border-radius: var(--r); padding: var(--s0);
  text-align: left; cursor: pointer;
}
.results button:hover { border-color: var(--muted); }
.results .mini-banner { width: 48px; height: 48px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--card); font-family: var(--name); font-size: 26px; flex: none; }
.results img { width: 48px; height: 48px; object-fit: cover; object-position: 50% 20%; border-radius: var(--r-sm); background: var(--tile); display: block; }
.results .meta { display: grid; min-width: 0; line-height: 1.3; }
.results strong { font-size: var(--t-md); font-weight: 600; }
.results .meta > span { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-count { font-size: var(--t-xs); color: var(--muted); margin: 0; }
.empty { color: var(--muted); font-size: var(--t-sm); }

/* cross-deck chips: "Also ruled" and "Meanwhile" */
.elsewhere { display: grid; gap: var(--s0); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s0); }
.chip {
  display: inline-flex; align-items: center; gap: var(--s0); min-height: 36px;
  background: var(--card); border: 1px solid var(--edge); border-radius: 999px;
  padding: 4px var(--s1) 4px var(--s0); cursor: pointer; font-size: var(--t-sm); line-height: 1.2; text-align: left;
}
.chip:hover { border-color: var(--muted); }
.chip-flag { flex: none; display: block; width: 21px; height: 14px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px var(--edge); }
.chip small { color: var(--muted); font-size: var(--t-xs); }
/* Meanwhile: a compact two-column grid of who held the other thrones */
.elsewhere .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.elsewhere .chip { border-radius: var(--r-sm); min-height: 44px; padding: 6px var(--s0); }
.elsewhere .chip > span:last-child { display: grid; min-width: 0; }
.elsewhere .chip small { white-space: nowrap; }
.also { justify-content: center; }

/* progress in the country picker */
.progress { height: 3px; border-radius: 2px; background: var(--rule); overflow: hidden; margin-top: 4px; }
.progress i { display: block; height: 100%; background: var(--accent); }

/* side-by-side timelines: one shared year axis, swipe between countries */
.tl-scroll { padding: 0; overflow: auto; scroll-snap-type: x mandatory; scroll-padding-left: 48px; overscroll-behavior: contain; }
.tl-grid { position: relative; display: flex; }
.tl-axis { position: sticky; left: 0; z-index: 3; flex: none; width: 48px; background: var(--table); }
.tl-axis .tick { left: 2px; width: 40px; }
.tl-corner { position: sticky; top: 0; height: 44px; background: var(--table); }
.tl-col { position: relative; flex: none; width: var(--col-w); scroll-snap-align: start; border-left: 1px solid var(--rule); }
.tl-head {
  position: sticky; top: 0; z-index: 2; height: 44px; display: flex; align-items: center; gap: var(--s0);
  padding: 0 var(--s1); background: var(--table); border-bottom: 1px solid var(--rule); font-weight: 600; font-size: var(--t-sm);
}
.tl-head .chip-flag { width: 24px; height: 16px; }
.tl-head[aria-current="true"] { color: var(--accent); }
.tl-plot { position: absolute; left: var(--s1); right: var(--s0); top: 44px; }
.tl-lines { position: absolute; left: 48px; top: 44px; pointer-events: none; }
.tl-col .label strong { font-size: var(--t-sm); }
.tl-marker { position: absolute; left: 48px; right: 0; height: 0; border-top: 2px solid var(--accent); z-index: 1; pointer-events: none; }
.tl-marker-year { position: absolute; left: 2px; transform: translateY(-50%); background: var(--accent); color: var(--card); font-size: var(--t-xs); font-weight: 600; border-radius: 4px; padding: 0 4px; font-variant-numeric: tabular-nums; z-index: 4; white-space: nowrap; }
.tl-hint { font-size: var(--t-xs); color: var(--muted); padding: 0 var(--s2) var(--s0); margin: 0; }

/* stats */
.stats-body { display: grid; align-content: start; gap: var(--s3); padding-top: var(--s0); max-width: 640px; margin: 0 auto; width: 100%; }
.stats-body section { display: grid; gap: var(--s1); }
.stats-body h3 { margin: 0; font-size: var(--t-lg); font-weight: 600; line-height: 1.25; }
.stats-body .sub { margin: 0; font-size: var(--t-sm); color: var(--muted); }
.legend-row { display: flex; flex-wrap: wrap; gap: var(--s0) var(--s1); font-size: var(--t-xs); color: var(--muted); }
.legend-row span { display: inline-flex; align-items: center; gap: var(--s-1); }
.danger { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s0); }
.danger li { display: grid; grid-template-columns: 24px minmax(0, 6.5rem) 1fr 2.75rem; align-items: center; gap: var(--s0); font-size: var(--t-sm); }
.danger .chip-flag { width: 24px; height: 16px; }
.danger .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.danger .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.stack { display: flex; gap: 2px; height: 16px; }
.stack i { display: block; height: 100%; min-width: 3px; }
.stack i:first-child { border-radius: 4px 0 0 4px; }
.stack i:last-child { border-radius: 0 4px 4px 0; }
.stack i:only-child { border-radius: 4px; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--card); font-size: var(--t-xs); line-height: 1.4; padding: 4px var(--s0); border-radius: 6px; max-width: 240px; opacity: 0; transition: opacity .12s; }
.seg-btns { display: flex; flex-wrap: wrap; gap: var(--s0); }
.seg-btns button { min-height: 36px; padding: 0 var(--s1); border-radius: 999px; border: 1px solid var(--edge); background: var(--card); cursor: pointer; font-size: var(--t-sm); }
.seg-btns button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.seg-btns button small { margin-left: 6px; opacity: .7; font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
.records { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s0); }
.record { background: var(--card); border: 1px solid var(--edge); border-radius: var(--r); padding: var(--s1); display: grid; gap: var(--s0); }
.record .k { font-size: 0.6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.rec-line { display: grid; grid-template-columns: 21px 1fr; gap: var(--s0); align-items: center; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-size: var(--t-sm); line-height: 1.3; }
.rec-line strong { font-weight: 600; }
.rec-line span span { color: var(--muted); font-size: var(--t-xs); }
.rec-line:hover strong { text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; }

/* record or rumour game */
.play-body { display: grid; align-content: start; gap: var(--s2); padding-top: var(--s0); max-width: 560px; width: 100%; margin: 0 auto; }
.play-body p { margin: 0; }
.play-intro { color: var(--muted); font-size: var(--t-sm); }
.pick { display: flex; flex-wrap: wrap; gap: var(--s0); margin-top: calc(var(--s1) * -1); }
.pick button { display: inline-flex; align-items: center; gap: var(--s0); min-height: 40px; padding: 0 var(--s1) 0 var(--s0); border-radius: 999px; border: 1px solid var(--edge); background: var(--card); cursor: pointer; font-size: var(--t-sm); }
.pick button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pick button[aria-pressed="false"] { color: var(--muted); }
.pick button small { color: var(--muted); font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
.pick .all { padding-left: var(--s1); }
.play-actions { display: flex; gap: var(--s0); flex-wrap: wrap; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--edge); }
.btn.ghost:hover { background: var(--tile); }
.q-top { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: calc(var(--s1) * -1); }
.q-card {

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const ALL = /*DATA*/null;      // { countryId: country file }
const { animate } = window.Motion ?? {};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;


/* Countries: the ones with a data file are live; the rest show as "coming soon". Flags are drawn, not emoji. */
const CATALOG = [
  { id: "england", name: "England & the UK", short: "England" },
  { id: "spain", name: "Spain", short: "Spain" },
  { id: "france", name: "France" },
  { id: "russia", name: "Russia", short: "Russia" },
  { id: "portugal", name: "Portugal" },
  { id: "japan", name: "Japan", short: "Japan" },
  { id: "ottoman", name: "Ottoman Empire", short: "Ottoman Empire" },
  { id: "scotland", name: "Scotland", short: "Scotland" },
  { id: "austria", name: "Habsburg Austria", short: "Austria" },
  { id: "rome", name: "Rome", short: "Rome" },
  { id: "westeros", name: "Westeros", short: "Westeros", fictional: true },
];
const FLAGS = {
  england: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#fff"/><rect x="12.5" width="5" height="20" fill="#c8102e"/><rect y="7.5" width="30" height="5" fill="#c8102e"/></svg>`,
  spain: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>`,
  france: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="10" height="20" fill="#002654"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce1126"/></svg>`,
  russia: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0039a6"/><rect y="13.33" width="30" height="6.67" fill="#d52b1e"/></svg>`,
  portugal: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#da291c"/><rect width="12" height="20" fill="#046a38"/></svg>`,
  ottoman: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#e30a17"/><circle cx="12" cy="10" r="5" fill="#fff"/><circle cx="13.3" cy="10" r="4" fill="#e30a17"/><path d="M17.6 10l3.7-1.2-2.3 3.1v-3.8l2.3 3.1z" fill="#fff"/></svg>`,
  rome: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#7b1c1c"/><rect x="1.5" y="1.5" width="27" height="17" fill="none" stroke="#d4a017" stroke-width="1"/><text x="15" y="13.4" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="7.6" letter-spacing=".3" fill="#d4a017">SPQR</text></svg>`,
  westeros: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#1f1b1b"/><g stroke="#c8c3bb" stroke-width=".8" stroke-linecap="round"><path d="M15 15L15 2.5M15 15L11.2 3.4M15 15L18.8 3.4M15 15L8 5.4M15 15L22 5.4M15 15L5.8 8.4M15 15L24.2 8.4"/></g><rect x="10.5" y="13" width="9" height="4.2" rx=".6" fill="#8d8780"/><rect x="9" y="16.2" width="12" height="1.6" fill="#b3202a"/></svg>`,
  scotland: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#005eb8"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="3.6"/></svg>`,
  austria: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#f6c700"/><rect width="30" height="10" fill="#1a1a1a"/></svg>`,
  japan: `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/></svg>`,
};

let country, DATA, houses, rulers, reigns, N, NOW;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const TODAY = (() => { const d = new Date(); return { date: d.toISOString().slice(0, 10) }; })();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
/* Dates are "[-]YYYY[-MM[-DD]]"; BC years are negative with no year zero ("-0044-03-15" is 15 March 44 BC). */
const parts = d => { const [, sign, y, m, day] = /^(-?)(\d+)(?:-(\d+))?(?:-(\d+))?$/.exec(d.date); return [(sign ? -1 : 1) * Number(y), m && Number(m), day && Number(day)]; };
const year = d => parts(d)[0];
/** Astronomical year (1 BC = 0), so arithmetic across the BC/AD line works. */
const astro = y => (y < 0 ? y + 1 : y);
const fromAstro = t => (t <= 0 ? t - 1 : t);
// Westeros counts After Conquest: "37 AC". Real places get "AD 14" for early years, plain "1066" later.
const showYear = (y, era = DATA?.era) => (y < 0 ? `${-y} BC` : era ? `${y} ${era}` : y <= 500 ? `AD ${y}` : `${y}`);
const asYears = d => { const [y, m = 1, day = 1] = parts(d); return astro(y) + (m - 1) / 12 + (day - 1) / 365; };
const utc = (y, m, d) => { const t = new Date(0); t.setUTCFullYear(astro(y), m - 1, d); return t.getTime(); }; // Date.UTC maps 0–99 to 1900s
const length = (a, b) => {
  const [y1, m1 = 1, d1 = 1] = parts(a), [y2, m2 = 1, d2 = 1] = parts(b);
  const months = (astro(y2) - astro(y1)) * 12 + (m2 - m1) - (d2 < d1 ? 1 : 0);
  if (months < 1) {
    const days = Math.round((utc(y2, m2, d2) - utc(y1, m1, d1)) / 864e5);
    return `${days} day${days === 1 ? "" : "s"}`;
  }
  const y = Math.floor(months / 12), mo = months % 12;
  return [y && `${y} yr${y > 1 ? "s" : ""}`, mo && `${mo} mo`].filter(Boolean).join(" ");
};
const span = (g, era = DATA?.era) => {
  const a = year(g.start), b = g.end && year(g.end);
  if (!g.end) return `${showYear(a, era)}–now`;
  if (a === b) return showYear(a, era);
  // "49–44 BC", "27 BC–AD 14", "AD 14–37"
  if (a < 0 && b < 0) return `${-a}–${-b} BC`;
  if (a > 0 && era) return `${a}–${b} ${era}`;
  if (a > 0 && b <= 500) return `AD ${a}–${b}`;
  return `${showYear(a, era)}–${showYear(b, era)}`;
};
const reignName = g => g.title ?? rulers[g.rulers[0]].name;
const reignHouses = g => {
  const ids = g.rulers.length ? g.rulers.map(id => rulers[id].house) : [g.house];
  return [...new Set(ids)].map(id => houses[id]).filter(Boolean);
};
// Republics and regimes aren't houses: label them by name only.
const houseLabel = g => {
  const hs = reignHouses(g);
  const names = hs.map(h => esc(h.name)).join(" & ");
  return g.kind === "interregnum" || hs.every(h => h.plain) ? names : `House of ${names}`;
};
const img = g => `img/${country}/${g.id}.jpg`;
/** Fictional worlds have no free-licence portraits: draw the ruler's house banner with their initial instead. */
const initial = g => reignName(g).replace(/^(The|King|Queen)\s+/, "")[0];
const banner = g => {
  const c = reignHouses(g)[0]?.color ?? "#6f665a";
  const num = (reignName(g).match(/\s([IVX]+)$/) ?? [])[1] ?? "";
  return `<svg class="banner" viewBox="0 0 120 190" role="img" aria-label="Banner of ${esc(houseLabel(g))}">
    <rect x="4" y="6" width="112" height="6" rx="3" fill="#8d8780"/>
    <path d="M14 12H106V176L60 150L14 176Z" fill="${c}"/>
    <path d="M22 20H98V160L60 139L22 160Z" fill="none" stroke="#fbf9f4" stroke-opacity=".45" stroke-width="1.5"/>
    <text x="60" y="${num ? 88 : 98}" text-anchor="middle" font-family="IM Fell English, serif" font-size="64" fill="#fbf9f4">${esc(initial(g))}</text>
    ${num ? `<text x="60" y="122" text-anchor="middle" font-family="IM Fell English, serif" font-size="22" letter-spacing="2" fill="#fbf9f4" fill-opacity=".85">${num}</text>` : ""}
  </svg>`;
};

/** Spring when Motion is available and motion is allowed; otherwise jump. */
function tween(from, to, onUpdate, opts = {}) {
  if (reduced || !animate) { onUpdate(to); opts.onComplete?.(); return { stop() {} }; }
  return animate(from, to, { type: "spring", stiffness: 340, damping: 36, restDelta: 0.001, ...opts, onUpdate });
}

/* ---------------- cards ---------------- */
function card(g, i) {
  const solo = g.rulers.length === 1 && g.kind !== "interregnum" && !g.title ? rulers[g.rulers[0]] : null;
  const hs = reignHouses(g);
  const next = reigns[i + 1];
  const p = g.images[0];
  const art = p ? `<img data-src="${img(g)}" alt="${esc(p.alt)}" draggable="false">` : banner(g);
  return `<article class="card" id="${g.id}" aria-roledescription="slide" aria-label="${esc(reignName(g))}, ${i + 1} of ${N}">
  <div class="card-inner">
    <div class="prev"><b>Previously</b>${esc(g.previously)}</div>
    <figure class="portrait">${art}</figure>
    <div class="title">
      <div class="house caps">${hs.map(h => `<span class="swatch" style="background:${h.color}"></span>`).join("")}${houseLabel(g)} · ${span(g)}</div>
      <h1>${esc(reignName(g))}</h1>
      ${solo?.epithet ? `<div class="epithet">${esc(solo.epithet)}</div>` : ""}
      <p class="tagline">${esc(g.tagline)}</p>
      ${alsoChips(g)}
    </div>
    <dl class="facts">
      <div><dt>Reign</dt><dd>${!g.end && DATA.present ? "Ongoing" : length(g.start, g.end ?? NOW)}</dd></div>
      <div><dt>Age</dt><dd>${esc(g.ageAtAccession)}</dd></div>
      <div><dt>Got it</dt><dd>${esc(g.cameToPower)}</dd></div>
      <div><dt>${g.end ? "Lost it" : "Now"}</dt><dd>${esc(g.reignEnded)}</dd></div>
    </dl>
    <div class="story">${g.paragraphs.map(t => `<p>${esc(t)}</p>`).join("")}</div>
    ${meanwhile(g)}
    ${g.claims.length ? `<section class="claims">
      <h2 class="section-label caps">Record or rumour?</h2>
      <ul>${g.claims.map(c => `<li><span class="status ${c.status}">${STATUS[c.status]}</span><span class="claim-text">${esc(c.text)}</span><span class="claim-note">${esc(c.note)}</span></li>`).join("")}</ul>
    </section>` : ""}
    <div class="hook">
      <h2 class="section-label caps">${g.hook ? "Next time" : DATA.epilogue ? "The end of the line" : "To be continued"}</h2>
      <p>${esc(g.hook ?? DATA.epilogue ?? "This story is still being written. Swipe back through the centuries of how we got here.")}</p>
      <button class="btn" data-go="${next ? i + 1 : 0}">${next ? `${esc(reignName(next))} →` : `← Back to ${esc(reignName(reigns[0]))}`}</button>
    </div>
    <details>
      <summary>${p ? "Sources and image credit" : "Sources"}</summary>
      <ul>
        ${g.sources.map(s => `<li>${s.author ? esc(s.author) + ", " : ""}<i>${esc(s.title)}</i>${s.note ? ` (${esc(s.note)})` : ""}</li>`).join("")}
        ${p ? `<li>Portrait: ${esc(p.credit)}, ${esc(p.made)}. ${esc(p.license)}. ${esc(p.caption)} <a href="${esc(p.page)}" target="_blank" rel="noopener">Wikimedia Commons</a></li>` : `<li>From George R. R. Martin's novels; a fictional world, so no portrait.</li>`}
      </ul>
    </details>
    ${g.review.status === "draft" ? `<div class="draft">Draft: not yet fact-checked</div>` : ""}
  </div>
</article>`;
}

const deck = document.getElementById("deck");
const rail = document.getElementById("rail");
let cards = [];
const count = document.getElementById("count");
const prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn");

/* ---------------- deck geometry + rendering ---------------- */
const GAP = 8;
let cardW = 0, step = 0, offset = 0, x = 0, index = 0, anim = null;

function measure() {
  const w = deck.clientWidth;
  cardW = Math.min(w - 2 * 16, 600);
  step = cardW + GAP;
  offset = (w - cardW) / 2;
  cards.forEach(c => (c.style.width = cardW + "px"));
  x = -index * step;
  render();
}
function render() {
  rail.style.transform = `translate3d(${offset + x}px,0,0)`;
  if (reduced) return;
  const lo = Math.max(0, Math.floor(-x / step) - 1), hi = Math.min(N - 1, Math.ceil(-x / step) + 1);
  for (let i = lo; i <= hi; i++) {
    const rel = (x + i * step) / step, d = Math.min(Math.abs(rel), 1);
    cards[i].style.transformOrigin = rel > 0 ? "0% 40%" : rel < 0 ? "100% 40%" : "50% 40%";
    cards[i].style.transform = `scale(${1 - d * 0.04})`;
  }
}
function loadNear(i) {
  for (let k = Math.max(0, i - 2); k <= Math.min(N - 1, i + 2); k++) {
    const im = cards[k].querySelector("img[data-src]");
    if (im) { im.src = im.dataset.src; im.removeAttribute("data-src"); }
  }
}
function setIndex(i) {
  index = i;
  count.textContent = `${i + 1} of ${N}`;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === N - 1;
  cards.forEach((c, k) => { c.inert = k !== i; });
  loadNear(i);
  try { history.replaceState(null, "", `#${country}.${cards[i].id}`); } catch {}
  markRead(country, cards[i].id);
}
function go(i, velocity = 0, instant = false) {
  i = Math.max(0, Math.min(N - 1, i));
  // Long jumps (from timeline/search) cut straight there; neighbours get the spring.
  if (Math.abs(i - index) > 2) instant = true;
  setIndex(i);
  anim?.stop();
  if (instant) {
    cards.forEach(c => (c.style.transform = ""));
    x = -i * step; render(); return;
  }
  anim = tween(x, -i * step, v => { x = v; render(); }, { velocity });
}

/* ---------------- drag: axis lock, rubberband, flick velocity (after use-gesture) ---------------- */
const rubber = (over, dim, c = 0.15) => (over * dim * c) / (dim + c * Math.abs(over));
let drag = null, suppressClick = false;

deck.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest("button, a, summary, input")) return;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, start: x, axis: null, samples: [[e.timeStamp, e.clientX]] };
});
deck.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.axis) {
    if (Math.hypot(dx, dy) < 8) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (drag.axis === "y") { drag = null; return; }
    anim?.stop();
    drag.start = x;
    deck.setPointerCapture(e.pointerId);
    deck.classList.add("dragging");
  }
  const min = -(N - 1) * step;
  let nx = drag.start + dx;
  if (nx > 0) nx = rubber(nx, cardW);
  else if (nx < min) nx = min + rubber(nx - min, cardW);
  x = nx;
  render();
  drag.samples.push([e.timeStamp, e.clientX]);
  if (drag.samples.length > 5) drag.samples.shift();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  deck.classList.remove("dragging");
  if (d.axis !== "x") return;
  suppressClick = Math.abs(e.clientX - d.x0) > 4;
  const [t0, x0] = d.samples[0], [t1, x1] = d.samples.at(-1);
  const v = t1 > t0 ? (x1 - x0) / (t1 - t0) : 0;
  const moved = (x - d.start) / step;
  let target = index;
  if (Math.abs(v) > 0.35) target = index + (v < 0 ? 1 : -1);
  else if (Math.abs(moved) > 0.2) target = index + (moved < 0 ? 1 : -1);
  go(target, v * 1000);
}
deck.addEventListener("pointerup", endDrag);
deck.addEventListener("pointercancel", endDrag);
deck.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

/* ---------------- views + tab bar ---------------- */
const views = Object.fromEntries(["timeline", "search", "play", "stats"].map(v => [v, document.getElementById(`view-${v}`)]));
const tabs = [...document.querySelectorAll(".tabs button")];
let view = "read";
const viewAnims = {};

function reveal(el, on) {
  viewAnims[el.id]?.stop();
  const from = Number(getComputedStyle(el).opacity);
  if (on) el.style.visibility = "visible";
  viewAnims[el.id] = tween(from, on ? 1 : 0, v => {
    el.style.opacity = v;
    el.style.transform = `translateY(${(1 - v) * 16}px)`;
  }, { stiffness: 420, damping: 40, onComplete: () => { if (!on) el.style.visibility = "hidden"; } });
}
function show(name) {
  if (name === view) { if (name === "read") go(index); return; }
  const prev = view;
  view = name;
  tabs.forEach(t => t.setAttribute("aria-current", t.dataset.tab === name ? "page" : "false"));
  if (name === "timeline") drawTimeline();
  if (name === "search") { renderCountries(); renderResults(); }
  if (name === "play") renderPlay();
  if (name === "stats") renderStats();
  if (views[name]) reveal(views[name], true);
  if (views[prev]) reveal(views[prev], false);
  deck.inert = name !== "read";
  if (name === "timeline") scrollTimelineToCurrent();
}
tabs.forEach(t => t.addEventListener("click", () => show(t.dataset.tab)));
function jumpTo(i) { show("read"); go(i, 0, true); }

/* ---------------- timeline: every country side by side on one year axis ---------------- */
// Swipe sideways between countries; scroll down through the years and every column moves together,
// so who-ruled-beside-whom is a straight line across. Westeros keeps its own calendar and column.
const ZOOMS = [2, 4, 8, 16, 32];          // px per year
let zoom = 1;
// Neighbours sit together: Rome, the British Isles, western Europe, then east to Japan.
const TL_ORDER = ["rome", "england", "scotland", "france", "spain", "portugal", "austria", "russia", "ottoman", "japan"];
const TL_TOP = 44;                        // height of the sticky country headers
let tlMarker = null;                      // astronomical year the reader tapped: a line across every column
let tlFrame = null;                       // { t0, ppy, era } of the last drawing, for taps and zoom

function tlColumns() {
  if (DATA.fictional) return [country];
  return [...TL_ORDER.filter(c => WORLD[c]), ...REAL.filter(c => !TL_ORDER.includes(c))];
}
function columnHTML(cid, t0, ppy) {
  const W = WORLD[cid], y = t => (t - t0) * ppy, LABEL_H = 40;
  // Lanes: each reign takes the leftmost lane free by its start, so a civil war splits into parallel lines.
  const laneEnds = [], lanes = W.list.map(e => {
    let k = laneEnds.findIndex(v => v <= e.s + 1 / 365);
    if (k < 0) k = laneEnds.length;
    laneEnds[k] = e.e;
    return k;
  });
  const labelX = 40 + Math.max(...lanes) * 18;
  let labelBottom = -Infinity, labels = "", bars = "", leaders = "";
  W.list.forEach((e, i) => {
    const a = y(e.s), h = Math.max(y(e.e) - a - 1, 2), left = lanes[i] * 18;
    const hs = e.g.rulers.length ? e.g.rulers.map(r => W.houses[W.rulers[r]?.house]) : [W.houses[e.g.house]];
    const xid = `${cid}.${e.g.id}`, nm = esc(e.name);
    if (hs.length > 1) hs.forEach((hh, k) => (bars += `<button class="bar half" data-x="${xid}" aria-label="${nm}" style="top:${a}px;height:${h}px;left:${left + k * 7}px;background:${hh?.color ?? "var(--muted)"}"></button>`));
    else bars += `<button class="bar" data-x="${xid}" aria-label="${nm}" style="top:${a}px;height:${h}px;left:${left}px;background:${hs[0]?.color ?? "var(--muted)"}"></button>`;
    const top = Math.max(a, labelBottom);
    labelBottom = top + LABEL_H;
    if (top - a > 2) {
      // Label pushed down by a crowded stretch: an elbow line ties it back to its bar.
      leaders += `<span class="leader" style="top:${a + 1}px;left:${left + 14}px;width:${labelX - 20 - left}px"></span>`;
      leaders += `<span class="leader-v" style="left:${labelX - 6}px;top:${a + 1}px;height:${top - a + 8}px"></span>`;
    }
    const cur = cid === country && i === index;
    labels += `<button class="label" data-x="${xid}" aria-current="${cur}" style="top:${top}px"><strong>${nm}</strong><span>${span(e.g, W.data.era)} · ${e.len}</span></button>`;
  });
  return { html: `<div class="tl-plot" style="--label-x:${labelX}px">${leaders}${bars}${labels}</div>`, bottom: labelBottom };
}
function drawTimeline() {
  const body = document.getElementById("timelineBody");
  const ppy = ZOOMS[zoom], cols = tlColumns(), era = DATA.fictional ? DATA.era : undefined;
  const t0 = Math.floor(Math.min(...cols.map(c => WORLD[c].list[0].s)) / 50) * 50;
  const t1 = Math.ceil(Math.max(...cols.flatMap(c => WORLD[c].list.map(e => e.e))) / 10) * 10;
  const y = t => (t - t0) * ppy;
  tlFrame = { t0, ppy, era };
  const vw = body.clientWidth || innerWidth;
  // One country fills the screen; several leave a sliver of the next column showing, so it reads as swipeable.
  const colW = cols.length === 1 ? Math.max(260, vw - 48) : Math.round(Math.min(380, Math.max(220, vw - 48 - 56)));
  let bottom = y(t1);
  const colsHTML = cols.map(cid => {
    const c = columnHTML(cid, t0, ppy);
    bottom = Math.max(bottom, c.bottom);
    return `<div class="tl-col" data-cid="${cid}">
      <div class="tl-head" aria-current="${cid === country}"><span class="chip-flag">${FLAGS[cid] ?? ""}</span>${esc(meta(cid)?.short ?? WORLD[cid].data.name)}</div>${c.html}</div>`;
  }).join("");
  const height = TL_TOP + bottom + 48;
  const every = ppy >= 16 ? 5 : ppy >= 8 ? 10 : ppy >= 4 ? 25 : 50;
  // Ticks fall on round historical years (50 BC, AD 1, AD 50): there is no year 0.
  let ticks = "", grid = "";
  const first = Math.ceil(fromAstro(t0) / every) * every;
  for (let hy = first; astro(hy) <= t1; hy += every) {
    const yr = hy === 0 ? 1 : hy, top = y(astro(yr));
    if (top < 0) continue;
    ticks += `<div class="tick" style="top:${TL_TOP + top}px">${showYear(yr, era)}</div>`;
    grid += `<div class="gridline" style="top:${top}px"></div>`;
  }
  body.innerHTML = `<div class="tl-grid" style="height:${height}px;width:${48 + cols.length * colW}px;--col-w:${colW}px">
    <div class="tl-axis"><div class="tl-corner"></div>${ticks}<span class="tl-marker-year" id="tlMarkerYear" hidden></span></div>
    <div class="tl-lines" style="width:${cols.length * colW}px">${grid}</div>
    ${colsHTML}
    <div class="tl-marker" id="tlMarker" hidden></div>
  </div>`;
  placeMarker();
  document.getElementById("timelineTitle").textContent = DATA.fictional ? `${meta(country)?.short ?? DATA.name} timeline` : "Timelines";
  document.getElementById("tlHint").textContent = DATA.fictional
    ? "Tap any reign to read it."
    : "Swipe sideways between countries. Tap a year to draw a line across them all.";
  document.getElementById("zoomLevel").textContent = `${ppy}px / year`;
  document.getElementById("zoomOut").disabled = zoom === 0;
  document.getElementById("zoomIn").disabled = zoom === ZOOMS.length - 1;
}
function placeMarker() {
  const line = document.getElementById("tlMarker"), tag = document.getElementById("tlMarkerYear");
  if (!line || tlMarker === null || !tlFrame) return;
  const top = TL_TOP + (tlMarker - tlFrame.t0) * tlFrame.ppy;
  line.hidden = tag.hidden = false;
  line.style.top = tag.style.top = `${top}px`;
  tag.textContent = showYear(fromAstro(Math.floor(tlMarker)), tlFrame.era);
}
function scrollTimelineToCurrent() {
  const body = document.getElementById("timelineBody");
  const col = body.querySelector(`.tl-col[data-cid="${country}"]`);
  if (col) body.scrollLeft = col.offsetLeft - 48;
  const cur = col?.querySelector('.label[aria-current="true"]');
  if (cur) body.scrollTop = Math.max(0, TL_TOP + cur.offsetTop - body.clientHeight / 3);
}
document.getElementById("timelineBody").addEventListener("click", e => {
  const t = e.target.closest("[data-x]");
  if (t) return openX(t.dataset.x);
  const grid = e.target.closest(".tl-grid");
  if (!grid || !tlFrame) return;
  const py = e.clientY - grid.getBoundingClientRect().top - TL_TOP;
  if (py < 0) return;
  tlMarker = tlFrame.t0 + py / tlFrame.ppy;
  placeMarker();
});
function rezoom(dz) {
  const body = document.getElementById("timelineBody");
  const centre = (body.scrollTop + body.clientHeight / 2 - TL_TOP) / ZOOMS[zoom];
  const left = body.scrollLeft;
  zoom = Math.max(0, Math.min(ZOOMS.length - 1, zoom + dz));
  drawTimeline();
  body.scrollTop = TL_TOP + centre * ZOOMS[zoom] - body.clientHeight / 2;
  body.scrollLeft = left;
}
document.getElementById("zoomIn").addEventListener("click", () => rezoom(1));
document.getElementById("zoomOut").addEventListener("click", () => rezoom(-1));

/* ---------------- search ---------------- */
const q = document.getElementById("q");
let haystack = [];
function renderResults() {
  const term = q.value.trim().toLowerCase();
  // "1483", "476", "44 bc", "ad 14"
  const ym = /^(?:ad\s*)?(\d{1,4})(\s*(?:bc|ac))?$/.exec(term);
  const yr = ym ? (/bc/.test(ym[2] ?? "") ? -Number(ym[1]) : Number(ym[1])) : null;
  const hits = reigns.map((g, i) => i).filter(i => {
    if (!term) return true;
    if (yr !== null) { const g = reigns[i]; return year(g.start) <= yr && yr <= (g.end ? year(g.end) : 9999); }
    return term.split(/\s+/).every(w => haystack[i].includes(w));
  });
  document.getElementById("resultCount").textContent = term
    ? `${hits.length} ${hits.length === 1 ? "ruler" : "rulers"}${yr !== null ? ` on the throne in ${showYear(yr)}` : ""}`
    : `All ${N} reigns, in order`;
  document.getElementById("results").innerHTML = hits.length
    ? hits.map(i => { const g = reigns[i]; return `<li><button data-jump="${i}">
        ${g.images.length ? `<img src="${img(g)}" alt="" loading="lazy">` : `<span class="mini-banner" style="background:${reignHouses(g)[0]?.color}">${esc(initial(g))}</span>`}
        <span class="meta"><strong>${esc(reignName(g))}</strong><span>${span(g)} · ${houseLabel(g)}</span></span>
      </button></li>`; }).join("")
    : `<li class="empty">No rulers match “${esc(q.value.trim())}”. Try a name like Henry, a house like Tudor, or a year like 1483.</li>`;
}
q.addEventListener("input", renderResults);
document.getElementById("results").addEventListener("click", e => {
  const t = e.target.closest("[data-jump]"); if (t) jumpTo(Number(t.dataset.jump));
});

/* ---------------- countries ---------------- */
const meta = id => CATALOG.find(c => c.id === id);
function renderCountries() {
  const item = c => {
    const live = !!ALL[c.id];
    const n = live ? ALL[c.id].reigns.length : 0, seen = live ? readSet(c.id).size : 0;
    const sub = live ? `${n} reigns${seen ? ` · ${Math.min(seen, n)} read` : ""}` : "Coming soon";
    return `<li><button data-country="${c.id}" aria-pressed="${c.id === country}" ${live ? "" : "disabled"}>
      <span class="mini-flag">${FLAGS[c.id] ?? ""}</span>
      <span class="meta"><strong>${esc(c.name)}</strong><span class="sub">${sub}</span>${seen ? `<span class="progress"><i style="width:${Math.min(100, (seen / n) * 100)}%"></i></span>` : ""}</span>
    </button></li>`;
  };
  document.getElementById("countries").innerHTML =
    CATALOG.filter(c => !c.fictional).map(item).join("") +
    `<li class="group" role="presentation">Fiction</li>` +
    CATALOG.filter(c => c.fictional).map(item).join("");
}
function loadCountry(id, reignId) {
  country = id;
  DATA = ALL[id];
  NOW = DATA.present ?? TODAY;
  houses = Object.fromEntries(DATA.houses.map(h => [h.id, h]));
  rulers = Object.fromEntries(DATA.rulers.map(r => [r.id, r]));
  // Optional arrays may be omitted in the JSON (the schema defaults them); normalise once here.
  reigns = DATA.reigns.map(g => ({ contestedWith: [], claims: [], ...g }));
  N = reigns.length;
  // Start the timeline zoomed in enough that labels sit near their bars (Rome's third century is crowded).
  const yearsSpan = asYears(reigns[N - 1].end ?? NOW) - asYears(reigns[0].start);
  const fit = ZOOMS.findIndex(ppy => yearsSpan * ppy >= N * 56);
  zoom = fit < 0 ? ZOOMS.length - 1 : Math.max(1, fit);
  haystack = reigns.map(g => [reignName(g), ...g.rulers.map(r => `${rulers[r].name} ${rulers[r].epithet ?? ""}`), ...reignHouses(g).map(h => h.name), g.tagline].join(" ").toLowerCase());

  anim?.stop();
  rail.innerHTML = reigns.map(card).join("");
  cards = [...rail.children];
  const name = meta(id)?.short ?? DATA.name;
  document.getElementById("countryName").textContent = name;
  document.getElementById("searchLabel").textContent = `Rulers of ${name}`;
  document.getElementById("timelineTitle").textContent = `${name} timeline`;
  document.getElementById("tabFlag").innerHTML = FLAGS[id] ?? "";
  deck.setAttribute("aria-label", `Rulers of ${name}`);
  q.value = "";
  renderCountries();
  try { localStorage.setItem("reign.country", id); } catch {}

  // No card asked for: carry on where this reader left off in this country.
  if (!reignId) { try { reignId = localStorage.getItem(`reign.pos.${id}`) ?? undefined; } catch {} }
  index = Math.max(0, reigns.findIndex(g => g.id === reignId));
  setIndex(index);
  measure();
}
document.getElementById("countries").addEventListener("click", e => {
  const b = e.target.closest("[data-country]");
  if (!b || b.disabled) return;
  if (b.dataset.country !== country) loadCountry(b.dataset.country);
  show("read");
});
document.getElementById("countryBtn").addEventListener("click", () => show("search"));

/* ---------------- the whole library, indexed once ---------------- */
const STATUS = { confirmed: "Record", disputed: "Disputed", legend: "Rumour" };
const REAL = CATALOG.filter(c => ALL[c.id] && !ALL[c.id].fictional).map(c => c.id);
const WORLD = Object.fromEntries(Object.entries(ALL).map(([cid, d]) => {
  const rulersById = Object.fromEntries(d.rulers.map(r => [r.id, r]));
  const housesById = Object.fromEntries(d.houses.map(h => [h.id, h]));
  const now = d.present ?? TODAY;
  const list = d.reigns.map((g0, i) => {
    const g = { contestedWith: [], claims: [], ...g0 };
    return {
      cid, i, g,
      name: g.title ?? rulersById[g.rulers[0]]?.name ?? g.id,
      s: asYears(g.start), e: asYears(g.end ?? now),
      len: !g.end && d.present ? "ongoing" : length(g.start, g.end ?? now),
    };
  });
  return [cid, { data: d, rulers: rulersById, houses: housesById, list }];
}));
const cname = cid => meta(cid)?.short ?? meta(cid)?.name ?? ALL[cid].name;
const reignOf = (cid, rid) => WORLD[cid].list.find(e => e.g.rulers.includes(rid));
const thumb = (cid, e) => e.g.images?.length
  ? `<img src="img/${cid}/${e.g.id}.jpg" alt="" loading="lazy">`
  : `<span class="mini-banner" style="background:${WORLD[cid].houses[WORLD[cid].rulers[e.g.rulers[0]]?.house ?? e.g.house]?.color ?? "var(--muted)"}">${esc(e.name[0])}</span>`;
const chip = (cid, e, text, small) =>
  `<button class="chip" data-x="${cid}.${e.g.id}"><span class="chip-flag">${FLAGS[cid] ?? ""}</span><span>${esc(text)}${small ? ` <small>${esc(small)}</small>` : ""}</span></button>`;

/** Open any card in any country (chips, timeline, stats, game). */
function openX(x) {
  const [cid, rid] = x.split(".");
  if (!ALL[cid]) return;
  if (cid !== country) loadCountry(cid, rid);
  else { const i = reigns.findIndex(g => g.id === rid); if (i >= 0 && i !== index) go(i, 0, true); }
  show("read");
}
rail.addEventListener("click", e => { const t = e.target.closest("[data-x]"); if (t) openX(t.dataset.x); });

/* The same person in two decks (Charles V of Austria is Charles I of Spain): matched on exact birth and death dates. */
const personKey = r => (r?.born?.date?.length >= 7 && r?.died?.date?.length >= 7 ? `${r.born.date}|${r.died.date}` : null);
const PEOPLE = {};
for (const cid of REAL) for (const r of ALL[cid].rulers) { const k = personKey(r); if (k) (PEOPLE[k] ??= []).push({ cid, rid: r.id }); }
function alsoChips(g) {
  if (DATA.fictional) return "";
  const out = [];
  for (const rid of g.rulers) for (const o of PEOPLE[personKey(rulers[rid])] ?? []) {
    if (o.cid === country) continue;
    const e = reignOf(o.cid, o.rid);
    if (e) out.push(chip(o.cid, e, `Also ${WORLD[o.cid].rulers[o.rid].name} of ${cname(o.cid)}`));
  }
  return out.length ? `<div class="chips also">${out.join("")}</div>` : "";
}
/* Who held the other thrones the moment this reign began. */
function meanwhile(g) {
  if (DATA.fictional) return "";
  const t = asYears(g.start) + 1 / 365, out = [];
  for (const cid of [...TL_ORDER, ...REAL].filter((c, k, a) => WORLD[c] && !WORLD[c].data.fictional && c !== country && a.indexOf(c) === k)) {
    const hits = WORLD[cid].list.filter(e => e.s <= t && t < e.e);
    const e = hits.find(h => h.g.kind !== "claimant") ?? hits[0];
    if (e) out.push(chip(cid, e, e.name, span(e.g, WORLD[cid].data.era)));
  }
  return out.length ? `<section class="elsewhere"><h2 class="section-label caps">Meanwhile, in ${showYear(year(g.start))}</h2><div class="chips">${out.join("")}</div></section>` : "";
}

/* ---------------- reading progress: where you were, and what you've seen ---------------- */
const readCache = {};
function readSet(cid) {
  if (!readCache[cid]) {
    let a = [];
    try { a = JSON.parse(localStorage.getItem(`reign.read.${cid}`) ?? "[]"); } catch {}
    readCache[cid] = new Set(Array.isArray(a) ? a : []);
  }
  return readCache[cid];
}
function markRead(cid, id) {
  try { localStorage.setItem(`reign.pos.${cid}`, id); } catch {}
  const s = readSet(cid);
  if (s.has(id)) return;
  s.add(id);
  try { localStorage.setItem(`reign.read.${cid}`, JSON.stringify([...s])); } catch {}
}
/* How a ruler died, sorted from the free-text causeOfDeath. Rumours don't count: "Illness; poison was rumoured" is illness.
   A short list of hand-checked exceptions covers what the patterns can't read. */
const FATE_FIX = {
  "england:william-ii": "accident", "russia:peter-iii": "murdered", "scotland:cuilen": "murdered", "scotland:donald-ii": "uncertain",
  "scotland:malcolm-ii": "uncertain", "scotland:indulf": "uncertain", "rome:maximian": "suicide", "rome:jovian": "accident",
  "rome:constans": "murdered", "westeros:maegor-i": "uncertain", "westeros:rhaenyra": "executed", "westeros:aegon-v": "accident",
  "westeros:baelor-i": "natural", "france:philip-iv": "natural", "rome:gordian-iii": "uncertain",
  "england:edward-ii": "murdered", "england:richard-ii": "murdered", "france:henry-vi-england": "murdered",
};
const FATE_RULES = [
  ["executed", /execut|behead|guillotin|hanged|put to death|burn(ed|t) alive|firing squad/i],
  ["poisoned", /poison(ed)?\b(?!.*(rumou?r|suspect))/i],
  ["suicide", /suicide|killed (him|her)self|took (his|her) own life|stabbed himself|cut wrists/i],
  ["battle", /battle|in combat|killed fighting|besieg|siege|crossbow|ambush|cannon|by the dornish|against vikings/i],
  ["murdered", /murder|assassin|stabbed|strangl|smother|throat cut|killed by|killed in the tower|starved|beaten to death|blinded|killed after|mob/i],
  ["accident", /accident|fell from|fall from|thrown from|drown|gored|lightning|cliff|joust|struck (his|her) head|fumes|fire at/i],
];
function fateOf(cid, r) {
  if (FATE_FIX[`${cid}:${r.id}`]) return FATE_FIX[`${cid}:${r.id}`];
  if (!r.died) return "alive";
  const c = r.causeOfDeath ?? "";
  if (!c || /^(unknown|uncertain|not recorded)/i.test(c) || /, or |sources differ|disputed|unclear/i.test(c)) return "uncertain";
  // Judge by what the record says first; a rumour after the semicolon doesn't change it.
  const first = c.split(";")[0];
  if (/^(illness|sudden illness|long illness|natural|fever|old age|stroke|plague|smallpox|died in|died a|tuberculosis|pneumonia|heart|dysentery|malaria|dropsy|lifelong)/i.test(first) && !/probably poison/i.test(first)) return "natural";
  for (const [k, re] of FATE_RULES) if (re.test(first)) return k;
  return "natural";
}

/* ---------------- how they went: fates, the most dangerous thrones, records ---------------- */
const FATES = { battle: "Killed in battle", murdered: "Murdered", executed: "Executed", poisoned: "Poisoned", suicide: "Suicide", accident: "Accident", uncertain: "Uncertain" };
const VIOLENT = ["battle", "murdered", "executed", "poisoned", "suicide"];
// Validated categorical set (CVD-safe, 3:1 on the card surface); uncertain is a neutral, not a category hue.
const FATE_GROUPS = [
  ["violent", "Violent death", "#a8353f"],
  ["accident", "Accident", "#c08417"],
  ["natural", "Natural causes", "#3a7bb8"],
  ["uncertain", "Uncertain", "#d6ccbb"],
];
const groupOf = f => (VIOLENT.includes(f) ? "violent" : f);
let statsFate = "murdered";
function peopleOf(cid) {
  return ALL[cid].rulers.map(r => ({ cid, r, e: reignOf(cid, r.id), fate: fateOf(cid, r) })).filter(p => p.e);
}
function ageYears(s) {
  s = (s ?? "").toLowerCase();
  if (/newborn|at birth/.test(s)) return 0;
  let m = s.match(/(\d+)\s*day/); if (m) return m[1] / 365;
  m = s.match(/(\d+)\s*month/); if (m) return m[1] / 12;
  m = s.match(/\d+/);
  return m ? Number(m[0]) : null;
}
function renderStats() {
  // One person, counted once: Henry VI sits in both the England and France decks.
  const seen = new Set();
  const everyone = REAL.flatMap(peopleOf).filter(p => { const k = personKey(p.r) ?? `${p.cid}:${p.r.id}`; if (seen.has(k)) return false; seen.add(k); return true; });
  const rows = REAL.map(cid => {
    const ps = peopleOf(cid).filter(p => p.fate !== "alive");
    const n = Object.fromEntries(FATE_GROUPS.map(([k]) => [k, 0]));
    ps.forEach(p => n[groupOf(p.fate)]++);
    return { cid, n, total: ps.length, pct: ps.length ? n.violent / ps.length : 0 };
  }).sort((a, b) => b.pct - a.pct);
  const legend = FATE_GROUPS.map(([, label, c]) => `<span><i class="swatch" style="background:${c}"></i>${label}</span>`).join("");
  const danger = rows.map(row => {
    const name = cname(row.cid);
    const segs = FATE_GROUPS.filter(([k]) => row.n[k]).map(([k, label, c]) =>
      `<i style="flex:${row.n[k]} 1 0;background:${c}" data-tip="${esc(name)}: ${row.n[k]} of ${row.total} rulers, ${label.toLowerCase()}"></i>`).join("");
    return `<li><span class="chip-flag">${FLAGS[row.cid] ?? ""}</span><span class="name">${esc(name)}</span><span class="stack">${segs}</span><span class="pct">${Math.round(row.pct * 100)}%</span></li>`;
  }).join("");

  const counts = Object.fromEntries(Object.keys(FATES).map(k => [k, everyone.filter(p => p.fate === k).length]));
  const fateBtns = Object.entries(FATES).filter(([k]) => counts[k]).map(([k, label]) =>
    `<button data-fate="${k}" aria-pressed="${k === statsFate}">${label}<small>${counts[k]}</small></button>`).join("");
  const list = everyone.filter(p => p.fate === statsFate).map(p => `<li><button data-x="${p.cid}.${p.e.g.id}">
      ${thumb(p.cid, p.e)}
      <span class="meta"><strong>${esc(p.r.name)}</strong><span>${esc(cname(p.cid))} · ${esc(p.r.causeOfDeath ?? "")}</span></span>
    </button></li>`).join("");

  // Records: one person on one throne (co-reigns and interregnums would muddy the numbers).
  const solo = REAL.flatMap(cid => WORLD[cid].list.filter(e => e.g.rulers.length === 1 && e.g.kind === "monarch"));
  const line = (e, value) => `<button class="rec-line" data-x="${e.cid}.${e.g.id}"><span class="chip-flag">${FLAGS[e.cid] ?? ""}</span><span><strong>${esc(e.name)}</strong> <span>${esc(value)}</span></span></button>`;
  const top3 = (arr, key, dir) => [...arr].filter(e => key(e) !== null).sort((a, b) => dir * (key(a) - key(b))).slice(0, 3);
  const ended = solo.filter(e => e.g.end);
  const records = [
    ["Longest reign", top3(solo, e => e.e - e.s, -1), e => e.len],
    ["Shortest reign", top3(ended, e => e.e - e.s, 1), e => e.len],
    ["Youngest to rule", top3(solo, e => ageYears(e.g.ageAtAccession), 1), e => `age ${e.g.ageAtAccession.toLowerCase()}`],
    ["Oldest to start", top3(solo, e => ageYears(e.g.ageAtAccession), -1), e => `age ${e.g.ageAtAccession.toLowerCase()}`],
  ].map(([k, es, val]) => `<div class="record"><span class="k">${k}</span>${es.map(e => line(e, val(e))).join("")}</div>`).join("");

  document.getElementById("statsBody").innerHTML = `
    <section>
      <h3>The most dangerous throne</h3>
      <p class="sub">Share of each country's rulers who died violently: in battle, murdered, executed, poisoned or by their own hand.</p>
      <div class="legend-row">${legend}</div>
      <ul class="danger">${danger}</ul>
    </section>
    <section>
      <h3>Browse by fate</h3>
      <div class="seg-btns" id="fateBtns">${fateBtns}</div>
      <ul class="results">${list}</ul>
    </section>
    <section>
      <h3>Records</h3>
      <div class="records">${records}</div>
    </section>
    <p class="sub">Real history only. Fates are sorted from each ruler's recorded cause of death; where the sources disagree, it counts as uncertain.</p>`;
}
const statsBody = document.getElementById("statsBody"), tip = document.getElementById("tip");
statsBody.addEventListener("click", e => {
  const f = e.target.closest("[data-fate]");
  if (f) { statsFate = f.dataset.fate; renderStats(); return; }
  const x = e.target.closest("[data-x]");
  if (x) openX(x.dataset.x);
});
// Hover (and tap) tooltip for the stacked bars.
function showTip(e) {
  const seg = e.target.closest("[data-tip]");
  if (!seg) { tip.style.opacity = 0; return; }
  tip.textContent = seg.dataset.tip;
  tip.style.opacity = 1;
  const w = tip.offsetWidth;
  tip.style.left = `${Math.min(innerWidth - w - 8, Math.max(8, e.clientX - w / 2))}px`;
  tip.style.top = `${e.clientY - 40}px`;
}
statsBody.addEventListener("pointermove", showTip);
statsBody.addEventListener("pointerdown", showTip);
statsBody.addEventListener("pointerleave", () => (tip.style.opacity = 0));
document.getElementById("view-stats").querySelector(".view-body").addEventListener("scroll", () => (tip.style.opacity = 0));

/* ---------------- record or rumour: guess how solid each story is ---------------- */
const GAME_LEN = 10;
const VERDICT = { confirmed: "on the record", disputed: "disputed", legend: "a rumour" };
const game = { picked: null, round: null };
try { game.picked = JSON.parse(localStorage.getItem("reign.game.picked") ?? "null"); } catch {}
if (!Array.isArray(game.picked) || !game.picked.some(c => WORLD[c])) game.picked = [...REAL];
game.picked = game.picked.filter(c => WORLD[c]);
const bestScore = () => { try { return Number(localStorage.getItem("reign.game.best") ?? 0); } catch { return 0; } };
const poolOf = cids => cids.flatMap(cid => WORLD[cid].list.flatMap(e => e.g.claims.map(c => ({ cid, e, c }))));
const FICTION = Object.keys(ALL).filter(c => ALL[c].fictional);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderPlay() {
  const el = document.getElementById("playBody"), r = game.round;
  document.getElementById("playScore").textContent = r && !r.done ? `Score ${r.score}` : bestScore() ? `Best ${bestScore()}/${GAME_LEN}` : "";
  if (!r) {
    const all = REAL.every(c => game.picked.includes(c));
    const btn = (cid, label) => `<button data-pick="${cid}" aria-pressed="${game.picked.includes(cid)}"><span class="chip-flag">${FLAGS[cid] ?? ""}</span>${esc(label)}<small>${poolOf([cid]).length}</small></button>`;
    el.innerHTML = `
      <p class="play-intro">Every card sorts its stories into record, disputed and rumour. Read the story, then guess which it is.</p>
      <h3 class="section-label caps">Pick your decks</h3>
      <div class="pick">
        <button class="all" data-pick="all" aria-pressed="${all}">All real history <small>${poolOf(REAL).length}</small></button>
        ${REAL.map(c => btn(c, cname(c))).join("")}
      </div>
      ${FICTION.length ? `<h3 class="section-label caps">Fiction</h3><div class="pick">${FICTION.map(c => btn(c, cname(c))).join("")}</div>` : ""}
      <div class="play-actions"><button class="btn" data-play="start">Play ${GAME_LEN} questions</button></div>
      <p class="play-intro">${poolOf(game.picked).length} stories in your decks.</p>`;
    return;
  }
  if (r.done) {
    const best = bestScore();
    const msg = r.score >= 9 ? "Chronicler-grade. The maesters would hire you." : r.score >= 6 ? "A sharp eye for a tall tale." : r.score >= 3 ? "History is slippery. Try another round." : "The rumour mill got you this time.";
    el.innerHTML = `
      <p class="score-big">${r.score}<span class="play-intro"> / ${r.qs.length}</span></p>
      <p>${msg}</p>
      <p class="play-intro">Best: ${best} / ${GAME_LEN}</p>
      <div class="play-actions"><button class="btn" data-play="start">Play again</button><button class="btn ghost" data-play="setup">Change decks</button></div>`;
    return;
  }
  const q = r.qs[r.i], name = q.e.name, who = `${esc(name)} · ${esc(cname(q.cid))}`;
  const head = `<div class="q-top"><span>Question ${r.i + 1} of ${r.qs.length}</span><span>${r.streak > 1 ? `${r.streak} in a row` : ""}</span></div>
    <div class="q-card" id="qCard"><div class="q-meta"><span class="chip-flag">${FLAGS[q.cid] ?? ""}</span>${who}</div><p class="q-text">${esc(q.c.text)}</p><span class="q-stamp" id="qStamp"></span></div>`;
  if (!r.answer) {
    el.innerHTML = `${head}
      <div class="answers"><button class="legend" data-ans="legend">Rumour</button><button class="disputed" data-ans="disputed">Disputed</button><button class="confirmed" data-ans="confirmed">Record</button></div>
      <p class="play-intro">Or swipe the card: left for rumour, right for record.</p>`;
    return;
  }
  const ok = r.answer === q.c.status;
  el.innerHTML = `${head}
    <div class="verdict">
      <p class="result">${ok ? "Right." : "Not quite."} It's <span class="status ${q.c.status}">${VERDICT[q.c.status]}</span></p>
      <p class="note">${esc(q.c.note)}</p>
      <button class="linkish" data-x="${q.cid}.${q.e.g.id}">Read ${esc(name)}'s card →</button>
    </div>
    <div class="play-actions"><button class="btn" data-play="next">${r.i + 1 < r.qs.length ? "Next" : "See your score"}</button></div>`;
}
function answer(st) {
  const r = game.round;
  if (!r || r.answer) return;
  r.answer = st;
  if (st === r.qs[r.i].c.status) { r.score++; r.streak++; } else r.streak = 0;
  renderPlay();
}
document.getElementById("playBody").addEventListener("click", e => {
  const t = e.target.closest("[data-pick], [data-play], [data-ans], [data-x]");
  if (!t) return;
  if (t.dataset.x) return openX(t.dataset.x);
  if (t.dataset.ans) return answer(t.dataset.ans);
  if (t.dataset.pick) {
    const c = t.dataset.pick;
    if (c === "all") game.picked = REAL.every(x => game.picked.includes(x)) ? game.picked : [...new Set([...game.picked, ...REAL])];
    else game.picked = game.picked.includes(c) ? game.picked.filter(x => x !== c) : [...game.picked, c];
    if (!game.picked.length) game.picked = [c === "all" ? REAL[0] : c];
    try { localStorage.setItem("reign.game.picked", JSON.stringify(game.picked)); } catch {}
    return renderPlay();
  }
  const r = game.round;
  if (t.dataset.play === "setup") game.round = null;
  if (t.dataset.play === "start") game.round = { qs: shuffle(poolOf(game.picked)).slice(0, GAME_LEN), i: 0, score: 0, streak: 0, answer: null, done: false };
  if (t.dataset.play === "next" && r) {
    if (r.i + 1 < r.qs.length) { r.i++; r.answer = null; }
    else {
      r.done = true;
      if (r.qs.length === GAME_LEN && r.score > bestScore()) { try { localStorage.setItem("reign.game.best", String(r.score)); } catch {} }
    }
  }
  renderPlay();
  document.querySelector("#view-play .view-body").scrollTop = 0;
});
// Swipe the question card: right for record, left for rumour.
let qDrag = null;
document.getElementById("playBody").addEventListener("pointerdown", e => {
  const c = e.target.closest("#qCard");
  if (!c || game.round?.answer) return;
  qDrag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, el: c, axis: null };
});
document.getElementById("playBody").addEventListener("pointermove", e => {
  if (!qDrag || e.pointerId !== qDrag.id) return;
  const dx = e.clientX - qDrag.x0, dy = e.clientY - qDrag.y0;
  if (!qDrag.axis) {
    if (Math.hypot(dx, dy) < 8) return;
    qDrag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (qDrag.axis === "y") { qDrag = null; return; }
    qDrag.el.setPointerCapture(e.pointerId);
  }
  qDrag.dx = dx;
  qDrag.el.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
  const stamp = document.getElementById("qStamp");
  const st = dx > 0 ? "confirmed" : "legend";
  stamp.textContent = STATUS[st];
  stamp.className = `q-stamp status ${st}`;
  stamp.style.opacity = Math.min(1, Math.abs(dx) / 90);
});
function endQDrag(e) {
  if (!qDrag || e.pointerId !== qDrag.id) return;
  const d = qDrag; qDrag = null;
  if (d.axis !== "x") return;
  if (Math.abs(d.dx) > 90) return answer(d.dx > 0 ? "confirmed" : "legend");
  tween(d.dx, 0, v => { d.el.style.transform = `translateX(${v}px) rotate(${v / 24}deg)`; });
  document.getElementById("qStamp").style.opacity = 0;
}
document.getElementById("playBody").addEventListener("pointerup", endQDrag);
document.getElementById("playBody").addEventListener("pointercancel", endQDrag);

/* ---------------- boot ---------------- */
// Deep links look like #spain.philip-ii; a bare #reign-id is an England link from before countries existed.
const parseHash = () => {
  const h = location.hash.slice(1);
  if (h.includes(".")) return h.split(".");
  return h ? ["england", h] : [];
};
const [hashCountry, hashReign] = parseHash();
// A pasted or edited link on an open page: jump there.
addEventListener("hashchange", () => {
  const [c, r] = parseHash();
  if (!ALL[c]) return;
  if (c !== country) loadCountry(c, r);
  else { const i = reigns.findIndex(g => g.id === r); if (i >= 0 && i !== index) go(i, 0, true); }
  show("read");
});
let saved = null;
try { saved = localStorage.getItem("reign.country"); } catch {}
const startCountry = [hashCountry, saved, "england"].find(c => c && ALL[c]);
tabs.forEach(t => t.setAttribute("aria-current", t.dataset.tab === "read" ? "page" : "false"));
loadCountry(startCountry, startCountry === hashCountry ? hashReign : undefined);
</script>
