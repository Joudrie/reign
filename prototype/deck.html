<title>Crown & Succession</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.24/dist/motion.js"></script>
<style>
/* Layout: a deck of cards on a horizontal rail (neighbours peek in from the edges); each card scrolls
   vertically on its own. A fixed dock at the bottom; the timeline is a separate sheet that slides up.
   System: 8px spacing scale, two radii (12 containers / 6 controls), one elevation, one committed dark look. */
:root {
  --ink: #0e1219;
  --panel: #171d29;
  --raised: #1e2533;
  --rule: #2a3243;
  --vellum: #ece3d0;
  --muted: #98a0b1;
  --gilt: #cfa94f;
  --confirmed: #86bd93;
  --disputed: #e39a63;
  --legend: #ae9ee6;

  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --body: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --t-xs: 0.6875rem;  /* 11 */
  --t-sm: 0.8125rem;  /* 13 */
  --t-md: 1rem;       /* 16 */
  --t-lg: 1.25rem;    /* 20 */
  --t-xl: 1.5rem;     /* 24 */
  --t-2xl: 2.5rem;    /* 40 */

  --s-1: 4px; --s0: 8px; --s1: 16px; --s2: 24px; --s3: 32px; --s4: 48px;
  --r: 12px; --r-sm: 6px;
  --lift: 0 8px 24px rgb(0 0 0 / 0.35);
  --dock-h: 64px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--vellum);
  font-family: var(--body);
  font-size: var(--t-md);
  line-height: 1.6;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }

/* ---------- top line ---------- */
.top {
  flex: none;
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s1);
  padding: var(--s1) var(--s1) var(--s0);
}
.realm { font-family: var(--display); font-size: var(--t-lg); line-height: 1.2; }
.realm span { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.08em; margin-left: var(--s0); }
.count { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }

/* ---------- deck ---------- */
.deck {
  flex: 1; min-height: 0;
  position: relative;
  overflow: hidden;
  touch-action: pan-y;
  padding-bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px));
}
.rail { position: absolute; top: 0; bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px)); left: 0; display: flex; gap: var(--s0); padding-block: var(--s0) var(--s1); will-change: transform; }
.card {
  flex: none;
  height: 100%;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  box-shadow: var(--lift);
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}
.card:focus { outline: none; }
.card:focus-visible { border-color: var(--muted); }
.deck.dragging { cursor: grabbing; user-select: none; }
.card-inner { padding: var(--s2) var(--s2) var(--s3); display: grid; gap: var(--s2); }
@media (max-width: 420px) { .card-inner { padding: var(--s1) var(--s1) var(--s3); } }

.prev {
  font-size: var(--t-sm); line-height: 1.45; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.prev b { font-family: var(--mono); font-weight: 500; font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gilt); margin-right: var(--s-1); }

.portrait { margin: 0; display: grid; justify-items: center; gap: var(--s0); }
.portrait img {
  display: block; height: 176px; width: auto; max-width: 100%; object-fit: contain;
  border-radius: var(--r-sm); border: 1px solid var(--rule);
  -webkit-user-drag: none; user-select: none;
}
.portrait figcaption { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--muted); }

.title { display: grid; gap: var(--s0); text-align: center; justify-items: center; }
.eyebrow { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: var(--s0); }
.swatch { width: 8px; height: 8px; border-radius: 2px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: var(--t-2xl); line-height: 1.05; text-wrap: balance; }
h1 em { color: var(--gilt); font-size: var(--t-lg); margin-left: var(--s0); }
.tagline { margin: 0; font-family: var(--display); font-style: italic; font-size: var(--t-xl); line-height: 1.25; text-wrap: balance; }
.relation { font-size: var(--t-sm); color: var(--muted); }

.facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--s0); }
.facts div { background: var(--raised); border-radius: var(--r-sm); padding: var(--s0) var(--s1); min-width: 0; }
.facts dt { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-size: var(--t-sm); line-height: 1.4; font-variant-numeric: tabular-nums; }

.story { display: grid; gap: var(--s1); }
.story p { margin: 0; }
.story p:first-child::first-letter { font-family: var(--display); float: left; font-size: 3.2em; line-height: 0.8; padding: var(--s-1) var(--s0) 0 0; color: var(--gilt); }

.label { margin: 0; font-family: var(--mono); font-weight: 500; font-size: var(--t-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gilt); }
.claims { display: grid; gap: var(--s1); }
.claims ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s1); }
.claims li { display: grid; grid-template-columns: auto 1fr; column-gap: var(--s0); row-gap: var(--s-1); align-items: baseline; }
.claims .note { grid-column: 2; font-size: var(--t-sm); color: var(--muted); line-height: 1.45; }
.chip { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 var(--s-1); border-radius: var(--r-sm); border: 1px solid currentColor; line-height: 1.6; }
.chip.confirmed { color: var(--confirmed); }
.chip.disputed { color: var(--disputed); }
.chip.legend { color: var(--legend); }
.claim-text { font-size: var(--t-md); font-weight: 600; line-height: 1.4; }

.hook { background: var(--raised); border-radius: var(--r); padding: var(--s2); display: grid; gap: var(--s1); }
.hook p { margin: 0; font-family: var(--display); font-size: var(--t-lg); line-height: 1.35; }
.btn {
  justify-self: start;
  font-family: var(--mono); font-weight: 500; font-size: var(--t-sm); letter-spacing: 0.04em;
  background: var(--gilt); color: var(--ink);
  border: 0; border-radius: var(--r-sm); padding: var(--s0) var(--s1); min-height: 40px; cursor: pointer;
}
.btn:hover { background: #dbb75f; }

details { font-size: var(--t-sm); color: var(--muted); }
summary { cursor: pointer; font-family: var(--mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; }
details ul { margin: var(--s0) 0 0; padding-left: var(--s1); display: grid; gap: var(--s-1); }
details a { color: inherit; }
.draft { font-family: var(--mono); font-size: var(--t-xs); color: var(--disputed); letter-spacing: 0.04em; }

.teaser .card-inner { min-height: 100%; align-content: center; justify-items: center; text-align: center; }
.teaser p { margin: 0; color: var(--muted); max-width: 40ch; }
.teaser svg { width: 100%; max-width: 280px; height: auto; }

/* ---------- dock ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  height: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px));
  padding: 0 var(--s1) env(safe-area-inset-bottom, 0px);
  background: var(--ink);
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s1);
}
.tl-btn {
  justify-self: start;
  display: inline-flex; align-items: center; gap: var(--s0);
  min-height: 40px; padding: 0 var(--s1);
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-sm);
  font-family: var(--mono); font-size: var(--t-sm); cursor: pointer;
}
.tl-btn:hover, .nav button:hover:not(:disabled) { border-color: var(--muted); }
.tl-btn svg { width: 16px; height: 16px; }
.dots { display: flex; gap: var(--s0); }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--rule); cursor: pointer; transition: background .2s, transform .2s; }
.dots button[aria-current="true"] { background: var(--gilt); transform: scale(1.25); }
.nav { justify-self: end; display: flex; gap: var(--s0); }
.nav button { width: 40px; height: 40px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-sm); cursor: pointer; font-size: var(--t-md); }
.nav button:disabled { opacity: 0.35; cursor: default; }

/* ---------- timeline sheet ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 5;
  background: var(--ink);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  visibility: hidden;
}
.sheet-head {
  flex: none;
  display: flex; align-items: center; gap: var(--s0);
  padding: calc(var(--s1) + env(safe-area-inset-top, 0px)) var(--s1) var(--s1);
  border-bottom: 1px solid var(--rule);
}
.sheet-head h2 { margin: 0 auto 0 0; font-family: var(--display); font-weight: 400; font-size: var(--t-xl); line-height: 1.2; }
.sheet-head button { min-width: 40px; height: 40px; padding: 0 var(--s0); background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-sm); cursor: pointer; font-family: var(--mono); font-size: var(--t-sm); }
.sheet-head button:disabled { opacity: 0.35; cursor: default; }
.zoom-level { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: var(--s2) var(--s1) calc(var(--s4) + env(safe-area-inset-bottom, 0px)); }
.legend-row { display: flex; flex-wrap: wrap; gap: var(--s1); margin-bottom: var(--s2); font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.06em; }
.legend-row span { display: inline-flex; align-items: center; gap: var(--s0); }
.axis { position: relative; margin-left: 48px; max-width: 560px; }
.tick { position: absolute; left: -48px; width: 40px; text-align: right; font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.tick::after { content: ""; position: absolute; left: 48px; top: 50%; width: 6px; border-top: 1px solid var(--rule); }
.spine { position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--rule); }
.reign {
  position: absolute; left: var(--s1); right: 0;
  display: flex; align-items: flex-start; gap: var(--s1);
  background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
}
.reign .bar { flex: none; width: 12px; height: 100%; border-radius: 3px; }
.reign .who { padding-top: 2px; display: grid; line-height: 1.3; min-width: 0; }
.reign .who strong { font-family: var(--display); font-weight: 400; font-size: var(--t-lg); }
.reign .who span { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.04em; }
.reign[aria-current="true"] .who strong { color: var(--gilt); }
.reign:hover .who strong { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.reign.soon { cursor: default; opacity: 0.55; }
.reign.soon:hover .who strong { text-decoration: none; }
.lanes { display: flex; gap: var(--s-1); height: 100%; flex: none; }
.lanes .bar { width: 4px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="top">
  <div class="realm">England<span>1066 →</span></div>
  <div class="count" id="count" aria-live="polite"></div>
</div>

<main class="deck" id="deck" aria-roledescription="carousel" aria-label="Rulers of England">
  <div class="rail" id="rail"></div>
</main>

<nav class="dock" aria-label="Navigation">
  <button class="tl-btn" id="openTimeline" aria-haspopup="dialog">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="1" width="3" height="5" rx="1" fill="currentColor"/><rect x="2" y="7" width="3" height="2" rx="1" fill="currentColor"/><rect x="2" y="10" width="3" height="5" rx="1" fill="currentColor"/><rect x="7" y="2" width="7" height="2" rx="1" fill="currentColor" opacity=".5"/><rect x="7" y="7" width="5" height="2" rx="1" fill="currentColor" opacity=".5"/><rect x="7" y="11" width="7" height="2" rx="1" fill="currentColor" opacity=".5"/></svg>
    Timeline
  </button>
  <div class="dots" id="dots"></div>
  <div class="nav">
    <button id="prevBtn" aria-label="Previous ruler">←</button>
    <button id="nextBtn" aria-label="Next ruler">→</button>
  </div>
</nav>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle">Timeline</h2>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <span class="zoom-level" id="zoomLevel"></span>
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="closeTimeline" aria-label="Close timeline">Close</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script>
const DATA = /*DATA*/null;
const { animate } = window.Motion ?? {};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const houses = Object.fromEntries(DATA.houses.map(h => [h.id, h]));
const rulers = Object.fromEntries(DATA.rulers.map(r => [r.id, r]));
const reigns = DATA.reigns;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const parts = d => d.date.split("-").map(Number);
const fmt = d => { const [y, m, day] = parts(d); return `${d.circa ? "c. " : ""}${day ? day + " " : ""}${m ? MONTHS[m - 1] + " " : ""}${y}`; };
const asYears = d => { const [y, m = 1, day = 1] = parts(d); return y + (m - 1) / 12 + (day - 1) / 365; };
const length = (a, b) => {
  const [y1, m1, d1] = parts(a), [y2, m2, d2] = parts(b);
  const months = (y2 - y1) * 12 + (m2 - m1) - (d2 < d1 ? 1 : 0);
  const y = Math.floor(months / 12), mo = months % 12;
  return [y && `${y} yr${y > 1 ? "s" : ""}`, mo && `${mo} mo`].filter(Boolean).join(" ") || "Under a month";
};

/** Spring when Motion is available and motion is allowed; otherwise jump. */
function tween(from, to, onUpdate, opts = {}) {
  if (reduced || !animate) { onUpdate(to); opts.onComplete?.(); return { stop() {} }; }
  return animate(from, to, { type: "spring", stiffness: 340, damping: 36, restDelta: 0.5, ...opts, onUpdate });
}

/* ---------------- cards ---------------- */
function card(reign, i) {
  const r = rulers[reign.rulers[0]];
  const house = houses[r.house];
  const next = reigns[i + 1];
  const portrait = reign.images[0];
  return `<article class="card" id="${reign.id}" aria-roledescription="slide" aria-label="${esc(r.name)}, ${i + 1} of ${reigns.length}">
  <div class="card-inner">
    <div class="prev"><b>Previously</b>${esc(reign.previously)}</div>
    <figure class="portrait">
      <img src="img/${reign.id}-0.jpg" alt="${esc(portrait.alt)}" draggable="false">
      <figcaption>Made ${esc(portrait.made)}</figcaption>
    </figure>
    <div class="title">
      <div class="eyebrow"><span class="swatch" style="background:${house.color}"></span>House of ${esc(house.name)} · ${parts(reign.start)[0]}–${parts(reign.end)[0]}</div>
      <h1>${esc(r.name)}${r.epithet ? `<em>${esc(r.epithet)}</em>` : ""}</h1>
      <p class="tagline">${esc(reign.tagline)}</p>
      <div class="relation">${esc(reign.relationToPredecessor)}</div>
    </div>
    <dl class="facts">
      <div><dt>Reign</dt><dd>${length(reign.start, reign.end)}</dd></div>
      <div><dt>Age</dt><dd>${esc(reign.ageAtAccession)}</dd></div>
      <div><dt>Got it</dt><dd>${esc(reign.cameToPower)}</dd></div>
      <div><dt>Lost it</dt><dd>${esc(reign.reignEnded)}</dd></div>
    </dl>
    <div class="story">${reign.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <section class="claims">
      <h2 class="label">Record or rumour?</h2>
      <ul>${reign.claims.map(c => `<li><span class="chip ${c.status}">${c.status}</span><span class="claim-text">${esc(c.text)}</span><span class="note">${esc(c.note)}</span></li>`).join("")}</ul>
    </section>
    <div class="hook">
      <h2 class="label">Next time</h2>
      <p>${esc(reign.hook)}</p>
      <button class="btn" data-go="${i + 1}">${next ? `${esc(rulers[next.rulers[0]].name)} →` : "What happens next →"}</button>
    </div>
    <details>
      <summary>Sources and image credit</summary>
      <ul>
        ${reign.sources.map(s => `<li>${s.author ? esc(s.author) + ", " : ""}<i>${esc(s.title)}</i>${s.note ? ` (${esc(s.note)})` : ""}</li>`).join("")}
        <li>Portrait: ${esc(portrait.credit)}, ${esc(portrait.license)}. ${esc(portrait.caption)} <a href="${esc(portrait.page)}" target="_blank" rel="noopener">Wikimedia Commons</a></li>
      </ul>
    </details>
    ${reign.review.status === "draft" ? `<div class="draft">Draft: not yet fact-checked</div>` : ""}
  </div>
</article>`;
}

const splitSvg = `<svg viewBox="0 0 280 56" aria-hidden="true">
  <rect x="0" y="24" width="100" height="8" rx="3" fill="${DATA.houses[0].color}"/>
  <path d="M100 28 C 130 28, 130 12, 160 12 L 280 12" stroke="var(--gilt)" stroke-width="8" fill="none"/>
  <path d="M100 28 C 130 28, 130 44, 160 44 L 280 44" stroke="var(--muted)" stroke-width="8" fill="none"/>
</svg>`;
const teaser = `<article class="card teaser" id="to-be-continued" aria-roledescription="slide" aria-label="Coming next">
  <div class="card-inner">
    <h2 class="label">Coming next</h2>
    ${splitSvg}
    <h1>The Anarchy</h1>
    <p class="tagline">Two cousins, one crown, nineteen years of war</p>
    <p>Stephen and Matilda both claim the throne, and the timeline splits in two. This preview has the first three of about 40 rulers.</p>
    <button class="btn" data-go="0">← Back to William I</button>
  </div>
</article>`;

const deck = document.getElementById("deck");
const rail = document.getElementById("rail");
rail.innerHTML = reigns.map(card).join("") + teaser;
const cards = [...rail.children];
const N = cards.length;

const dots = document.getElementById("dots");
dots.innerHTML = cards.map((c, i) => `<button data-go="${i}" aria-label="${esc(c.getAttribute("aria-label"))}"></button>`).join("");
const count = document.getElementById("count");
const prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn");

/* ---------------- deck geometry + rendering ---------------- */
const GAP = 8;
let cardW = 0, step = 0, offset = 0, x = 0, index = 0, anim = null;

function measure() {
  const w = deck.clientWidth;
  cardW = Math.min(w - 2 * 24, 560);       // neighbours peek in from both edges on phones
  step = cardW + GAP;
  offset = (w - cardW) / 2;
  cards.forEach(c => (c.style.width = cardW + "px"));
  x = -index * step;
  render();
}
function render() {
  rail.style.transform = `translate3d(${offset + x}px,0,0)`;
  if (reduced) return;
  for (let i = 0; i < N; i++) {
    const rel = (x + i * step) / step, d = Math.min(Math.abs(rel), 1);
    // Shrink towards the active card so the peeking edge stays in view.
    cards[i].style.transformOrigin = rel > 0 ? "0% 40%" : rel < 0 ? "100% 40%" : "50% 40%";
    cards[i].style.transform = `scale(${1 - d * 0.06})`;
    cards[i].style.opacity = String(1 - d * 0.45);
  }
}
function setIndex(i) {
  index = i;
  count.textContent = i < reigns.length ? `${i + 1} of ${reigns.length}` : "Coming next";
  dots.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-current", String(k === i)));
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === N - 1;
  cards.forEach((c, k) => { c.inert = k !== i; });
  try { history.replaceState(null, "", "#" + cards[i].id); } catch {}
}
function go(i, velocity = 0) {
  i = Math.max(0, Math.min(N - 1, i));
  setIndex(i);
  anim?.stop();
  anim = tween(x, -i * step, v => { x = v; render(); }, { velocity });
}

/* ---------------- drag: axis lock, rubberband, flick velocity (after use-gesture) ---------------- */
const rubber = (over, dim, c = 0.15) => (over * dim * c) / (dim + c * Math.abs(over));
let drag = null, suppressClick = false;

deck.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest("button, a, summary")) return;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, start: x, axis: null, samples: [[e.timeStamp, e.clientX]] };
});
deck.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.axis) {
    if (Math.hypot(dx, dy) < 8) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (drag.axis === "y") { drag = null; return; }   // let the card scroll natively
    anim?.stop();
    drag.start = x;
    deck.setPointerCapture(e.pointerId);
    deck.classList.add("dragging");
  }
  const min = -(N - 1) * step;
  let nx = drag.start + dx;
  if (nx > 0) nx = rubber(nx, cardW);
  else if (nx < min) nx = min + rubber(nx - min, cardW);
  x = nx;
  render();
  drag.samples.push([e.timeStamp, e.clientX]);
  if (drag.samples.length > 5) drag.samples.shift();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  deck.classList.remove("dragging");
  if (d.axis !== "x") return;
  suppressClick = Math.abs(e.clientX - d.x0) > 4;
  const [t0, x0] = d.samples[0], [t1, x1] = d.samples.at(-1);
  const v = t1 > t0 ? (x1 - x0) / (t1 - t0) : 0;           // px per ms
  const moved = (x - d.start) / step;
  let target = Math.round(-x / step);
  if (Math.abs(v) > 0.35 || Math.abs(moved) > 0.2) target = index + (v < 0 || (Math.abs(v) <= 0.35 && moved < 0) ? 1 : -1);
  go(target, v * 1000);
}
deck.addEventListener("pointerup", endDrag);
deck.addEventListener("pointercancel", endDrag);
deck.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if (t) go(Number(t.dataset.go));
});
prevBtn.addEventListener("click", () => go(index - 1));
nextBtn.addEventListener("click", () => go(index + 1));
document.addEventListener("keydown", e => {
  if (sheetOpen) { if (e.key === "Escape") closeSheet(); return; }
  if (e.key === "ArrowRight") go(index + 1);
  if (e.key === "ArrowLeft") go(index - 1);
});
addEventListener("resize", measure);

/* ---------------- timeline sheet ---------------- */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
const zoomLevel = document.getElementById("zoomLevel");
const ZOOMS = [4, 8, 16, 32];                       // px per year
let zoom = 1, sheetOpen = false, sheetAnim = null;

// Preview of what comes after the drafted cards: the timeline splits during the Anarchy.
const SOON = { title: "The Anarchy", sub: "Stephen vs Matilda · 1135–1154", start: 1135.92, end: 1154.82, lanes: ["#c4813a", "#6f86b8"] };

function drawTimeline() {
  const ppy = ZOOMS[zoom];
  const t0 = Math.floor(asYears(reigns[0].start) / 10) * 10;
  const t1 = Math.ceil(SOON.end / 10) * 10;
  const y = t => (t - t0) * ppy;
  const minH = 40;
  let html = `<div class="legend-row"><span><i class="swatch" style="background:${DATA.houses[0].color}"></i>House of Normandy</span><span>Bar length = length of reign</span></div>`;
  html += `<div class="axis" style="height:${y(t1) + minH}px"><div class="spine"></div>`;
  const every = ppy >= 16 ? 5 : 10;
  for (let t = t0; t <= t1; t += every) html += `<div class="tick" style="top:${y(t)}px">${t}</div>`;
  reigns.forEach((g, i) => {
    const r = rulers[g.rulers[0]];
    const a = asYears(g.start), b = asYears(g.end);
    html += `<button class="reign" data-jump="${i}" aria-current="${i === index}" style="top:${y(a)}px;height:${Math.max(y(b) - y(a) - 2, 6)}px;min-height:6px">
      <span class="bar" style="background:${houses[r.house].color}"></span>
      <span class="who"><strong>${esc(r.name)}</strong><span>${parts(g.start)[0]}–${parts(g.end)[0]} · ${length(g.start, g.end)}</span></span>
    </button>`;
  });
  html += `<div class="reign soon" style="top:${y(SOON.start)}px;height:${y(SOON.end) - y(SOON.start)}px">
      <span class="lanes">${SOON.lanes.map(c => `<span class="bar" style="background:${c}"></span>`).join("")}</span>
      <span class="who"><strong>${SOON.title}</strong><span>${SOON.sub} · coming soon</span></span>
    </div>`;
  html += `</div>`;
  sheetBody.innerHTML = html;
  zoomLevel.textContent = `${ppy}px / yr`;
  document.getElementById("zoomOut").disabled = zoom === 0;
  document.getElementById("zoomIn").disabled = zoom === ZOOMS.length - 1;
}

function openSheet() {
  sheetOpen = true;
  drawTimeline();
  sheet.style.visibility = "visible";
  sheetAnim?.stop();
  const h = innerHeight;
  sheetAnim = tween(h, 0, v => (sheet.style.transform = `translateY(${v}px)`), { stiffness: 300, damping: 34 });
  const current = sheetBody.querySelector('[aria-current="true"]');
  if (current) sheetBody.scrollTop = Math.max(0, current.offsetTop - 80);
  document.getElementById("closeTimeline").focus();
}
function closeSheet(after) {
  sheetOpen = false;
  sheetAnim?.stop();
  const from = new DOMMatrix(getComputedStyle(sheet).transform).m42;
  sheetAnim = tween(from, innerHeight, v => (sheet.style.transform = `translateY(${v}px)`), {
    stiffness: 300, damping: 34,
    onComplete: () => { if (!sheetOpen) sheet.style.visibility = "hidden"; after?.(); },
  });
  document.getElementById("openTimeline").focus();
}
document.getElementById("openTimeline").addEventListener("click", openSheet);
document.getElementById("closeTimeline").addEventListener("click", () => closeSheet());
document.getElementById("zoomIn").addEventListener("click", () => { zoom = Math.min(ZOOMS.length - 1, zoom + 1); drawTimeline(); });
document.getElementById("zoomOut").addEventListener("click", () => { zoom = Math.max(0, zoom - 1); drawTimeline(); });
sheetBody.addEventListener("click", e => {
  const t = e.target.closest("[data-jump]");
  if (!t) return;
  const i = Number(t.dataset.jump);
  closeSheet();
  go(i);
});

/* ---------------- boot ---------------- */
const startAt = Math.max(0, cards.findIndex(c => "#" + c.id === location.hash));
index = startAt;
setIndex(startAt);
measure();
</script>
